<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2F3D"/>
      <stop offset="100%" stop-color="#2D3E4F"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0CC0DF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C1FF72" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0CC0DF"/>
      <stop offset="100%" stop-color="#C1FF72"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="24" fill="url(#bgGrad)"/>
  <circle cx="480" cy="100" r="140" fill="url(#glowGrad)" filter="blur(40px)"/>
  <circle cx="120" cy="400" r="120" fill="url(#glowGrad)" filter="blur(40px)"/>
  
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="170" height="30" rx="15" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <circle cx="16" cy="15" r="5" fill="#C1FF72"/>
    <text x="30" y="19" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CLINICAL EXCELLENCE</text>
  </g>

  <!-- Central Visual Motif -->
  <g transform="translate(150, 110)">
    <rect x="0" y="0" width="300" height="240" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(12,192,223,0.3)" stroke-width="1.5"/>
    <!-- Tooth / Diamond graphic -->
    <path d="M150 40 C110 40, 70 70, 70 120 C70 170, 100 200, 120 210 C135 217, 145 195, 150 195 C155 195, 165 217, 180 210 C200 200, 230 170, 230 120 C230 70, 190 40, 150 40 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3.5"/>
    <circle cx="150" cy="115" r="32" fill="none" stroke="#0CC0DF" stroke-dasharray="4 4" stroke-width="2"/>
    <path d="M138 115 L147 124 L164 107" fill="none" stroke="#C1FF72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse scanline -->
    <line x1="20" y1="120" x2="280" y2="120" stroke="rgba(12,192,223,0.3)" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <!-- Title & Specs Banner -->
  <g transform="translate(40, 390)">
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Ceramic Braces</text>
    <text x="0" y="24" fill="#C1FF72" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Tooth-Coloured Discreet Orthodontic Correction</text>
    <text x="0" y="46" fill="rgba(255,255,255,0.65)" font-family="system-ui, sans-serif" font-size="11">Dr. Amit Srivastava • 29+ Years • South Delhi</text>
  </g>
</svg>
